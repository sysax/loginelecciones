name: Compilar para Windows

on:
  release:
    types: [created]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Descargar Código
      uses: actions/checkout@v4

    - name: Instalar Qt 6
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.6.0'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2019_64'
        modules: 'qtsql'
        aqtsource: 'git+https://github.com'

    - name: Configurar MSVC (Compilador de Windows)
      uses: ilammy/msvc-dev-cmd@v1

    - name: Compilar Proyecto con CMake
      run: |
        mkdir build
        cd build
        cmake -DCMAKE_BUILD_TYPE=Release ..
        cmake --build . --config Release

    - name: Empaquetar dependencias (Windeployqt)
      run: |
        cd build\Release
        windeployqt --qmldir . LoginElecciones.exe

    - name: Subir ejecutable al Release de GitHub
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: build/Release/LoginElecciones.exe
        asset_name: LoginElecciones-Windows.exe
        tag: ${{ github.ref }}
        overwrite: true

