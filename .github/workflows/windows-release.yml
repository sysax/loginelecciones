# Guardar como: .github/workflows/windows-release.yml
# (reemplaza el actual)
#
# Disparador: al pushear un tag "v*" (ej: git tag v1.0.0 && git push origin v1.0.0)
# se compila, se genera ZIP portatil + instalador y se publican en GitHub Releases.

name: Build LoginElecciones (Windows)

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: write

env:
  APP_NAME: LoginElecciones

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Qt oficial (incluye el driver QPSQL y libpq.dll)
      # Mucho más rápido que compilar Qt con vcpkg (~5 min vs ~1 hora)
      - name: Instalar Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - name: Compilar (Release)
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel

      - name: Desplegar DLLs de Qt (incluye sqldrivers + libpq)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = Join-Path $env:GITHUB_WORKSPACE 'dist'
          New-Item -ItemType Directory -Path $dist -Force | Out-Null
          Copy-Item "build\$env:APP_NAME.exe" $dist\

          windeployqt --release --compiler-runtime "$dist\$env:APP_NAME.exe"

          # Verificar el driver PostgreSQL del que depende la app
          if (-not (Test-Path "$dist\sqldrivers\qsqlpsql.dll")) {
            throw 'windeployqt no copió qsqlpsql.dll'
          }

          # windeployqt NO copia libpq.dll (no es una DLL de Qt):
          # copiarla manualmente junto con sus dependencias (openssl, etc.)
          if (-not (Test-Path "$dist\libpq.dll")) {
            $qtBin = Split-Path (Get-Command windeployqt).Source
            Write-Host "Carpeta bin de Qt: $qtBin"
            Copy-Item "$qtBin\libpq.dll" $dist\ -Force
            Get-ChildItem "$qtBin\libssl-*.dll","$qtBin\libcrypto-*.dll","$qtBin\libintl-*.dll" -ErrorAction SilentlyContinue |
              Copy-Item -Destination $dist -Force
          }
          if (-not (Test-Path "$dist\libpq.dll")) {
            throw 'No se pudo copiar libpq.dll desde la carpeta bin de Qt.'
          }

          Write-Host '--- Contenido de dist ---'
          Get-ChildItem $dist -Recurse -File | Select-Object -ExpandProperty FullName

      - name: Crear ZIP portátil
        shell: pwsh
        run: |
          $zip = "$env:GITHUB_WORKSPACE\$env:APP_NAME-Windows-Portable.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "$env:GITHUB_WORKSPACE\dist\*" -DestinationPath $zip

      - name: Instalar Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Crear instalador .exe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "$env:GITHUB_REF_NAME".TrimStart('v')
          if ($tag -notmatch '^\d') { $tag = '1.0.0' }
          $dist = Join-Path $env:GITHUB_WORKSPACE 'dist'
          $outDir = Join-Path $env:GITHUB_WORKSPACE 'installer'
          New-Item -ItemType Directory -Path $outDir -Force | Out-Null

          $iss = @"
          #define MyAppName "$env:APP_NAME"
          #define MyAppVersion "$tag"
          [Setup]
          AppId={{B36A1C7E-1F26-4E0E-9E61-2A97B53C6F11}
          AppName={#MyAppName}
          AppVersion={#MyAppVersion}
          DefaultDirName={autopf}\{#MyAppName}
          DefaultGroupName={#MyAppName}
          OutputDir="$outDir"
          OutputBaseFilename=$env:APP_NAME-Setup
          Compression=lzma2
          SolidCompression=yes
          WizardStyle=modern
          ArchitecturesInstallIn64BitMode=x64
          UninstallDisplayIcon={app}\{#MyAppName}.exe
          [Languages]
          Name: "spanish"; MessagesFile: "compiler:Languages\Spanish.isl"
          [Tasks]
          Name: "desktopicon"; Description: "Crear un acceso directo en el escritorio"; Flags: unchecked
          [Files]
          Source: "$dist\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs
          [Icons]
          Name: "{group}\{#MyAppName}"; Filename: "{app}\{#MyAppName}.exe"
          Name: "{autodesktop}\{#MyAppName}"; Filename: "{app}\{#MyAppName}.exe"; Tasks: desktopicon
          [Run]
          Filename: "{app}\{#MyAppName}.exe"; Description: "Iniciar {#MyAppName}"; Flags: postinstall nowait skipifsilent
          "@

          $issPath = Join-Path $env:GITHUB_WORKSPACE 'installer.iss'
          Set-Content -Path $issPath -Value $iss -Encoding utf8

          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "$env:ProgramFiles\Inno Setup 6\ISCC.exe" }
          & $iscc $issPath
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup falló (código $LASTEXITCODE)." }

      - name: Publicar en GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            LoginElecciones-Windows-Portable.zip
            installer/LoginElecciones-Setup.exe
          fail_on_unmatched_files: true
